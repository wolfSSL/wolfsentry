name: Semgrep

run-name: ${{ inputs.nightly_run_id || github.workflow }}

on:
  push:
    branches: [ 'master', 'release/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      nightly_run_id:
        description: Nightly coordinator run ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  semgrep:
    name: Semgrep security rules
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Trust workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Run wolfSentry security rules
      run: semgrep scan --config .github/semgrep-rules.yml --error --quiet .
