name: Build Options

run-name: ${{ inputs.nightly_run_id || github.workflow }}

on:
  push:
    branches: [ 'master', 'release/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      nightly_run_id:
        description: Nightly coordinator run ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  options:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dynamic library
            target: dynamic-build-test
          - name: C89
            target: c89-test
          - name: Single-threaded
            target: singlethreaded-test
          - name: No JSON
            target: no-json-test
          - name: No JSON DOM
            target: no-json-dom-test
          - name: No error strings
            target: no-error-strings-test
          - name: No protocol names
            target: no-protocol-names-test
          - name: No getprotoby
            target: no-getprotoby-test
          - name: No stdio streams
            target: no-stdio-streams-build-test
          - name: Minimal
            target: minimal-build-test
          - name: Minimal threaded
            target: minimal-threaded-build-test
          - name: User settings
            target: user-settings-build-test
          - name: Short enums
            target: short-enums-test
          - name: Prefix-only address matching
            target: no-addr-bitmask-matching-test
          - name: No IPv6
            target: no-ipv6-test

    steps:
    - uses: actions/checkout@v4
    - name: Trust workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Test configuration
      run: make -j2 ${{ matrix.target }}

  wolfcose-deps:
    name: Build wolfCOSE dependencies
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    steps:
    - name: Build wolfSSL and wolfCOSE
      run: |
        WOLFSSL_REF=$(git ls-remote --tags --refs \
          https://github.com/wolfSSL/wolfssl.git 'v*-stable' \
          | awk -F/ '{print $NF}' | sort -V | tail -n 1)
        test -n "$WOLFSSL_REF"
        mkdir -p /opt/wolfsentry-deps
        cd /opt/wolfsentry-deps
        git clone --depth 1 --branch "$WOLFSSL_REF" \
          https://github.com/wolfSSL/wolfssl.git wolfssl
        git clone --depth 1 https://github.com/wolfSSL/wolfCOSE.git wolfCOSE
        cd wolfssl
        ./autogen.sh
        ./configure --enable-ecc --enable-ed25519 --enable-ed448 \
          --enable-curve25519 --enable-curve448 --enable-aesgcm \
          --enable-aesccm --enable-sha384 --enable-sha512 --enable-keygen \
          --enable-hkdf --enable-aeskeywrap --enable-chacha \
          --enable-poly1305 --enable-rsapss \
          --prefix=/opt/wolfsentry-deps/wolfssl-install
        make -j"$(nproc)"
        make install
        cd ..
        make -C wolfCOSE -j"$(nproc)" EXTRA_CFLAGS=-fPIC \
          WOLFSSL_CFLAGS="-isystem /opt/wolfsentry-deps/wolfssl-install/include" \
          WOLFSSL_LIBS="-L/opt/wolfsentry-deps/wolfssl-install/lib -lwolfssl" \
          all
        tar -C /opt -czf "$GITHUB_WORKSPACE/wolfsentry-deps.tar.gz" \
          wolfsentry-deps/wolfssl-install wolfsentry-deps/wolfCOSE/include \
          wolfsentry-deps/wolfCOSE/libwolfcose.a
    - uses: actions/upload-artifact@v4
      with:
        name: wolfcose-deps
        path: wolfsentry-deps.tar.gz
        retention-days: 1

  wolfcose:
    name: wolfCOSE ${{ matrix.config }}
    needs: wolfcose-deps
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    strategy:
      fail-fast: false
      matrix:
        config:
          - default
          - no-json
          - no-json-dom
          - singlethreaded
          - c99
          - no-routes
          - no-addr-family-names
          - no-route-endpoints
          - no-events
          - no-user-values
          - no-eventconfig
          - no-transactions
          - no-legacy-event-syntax
          - no-error-messages
          - no-text-numbers
          - no-text-addresses
          - minimal
          - minimal-no-json
          - reduced
          - total-limit
          - nesting-limit
          - user-settings
          - dynamic
    env:
      CPATH: /opt/wolfsentry-deps/wolfssl-install/include
    steps:
    - uses: actions/checkout@v4
    - name: Trust workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/download-artifact@v4
      with:
        name: wolfcose-deps
    - name: Install dependencies
      run: tar -C /opt -xzf wolfsentry-deps.tar.gz
    - name: Test configuration
      run: |
        make -j2 WOLFCOSE_REQUIRED=1 \
          WOLFCOSE_TEST_TOP=/opt/wolfsentry-deps/wolfCOSE \
          wolfcose-${{ matrix.config }}-test
