name: CodeQL

run-name: ${{ inputs.nightly_run_id || github.workflow }}

on:
  push:
    branches: [ 'master', 'release/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      nightly_run_id:
        description: Nightly coordinator run ID
        required: false
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  analyze:
    name: CodeQL (C/C++)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfssl/wolfcose-ci@sha256:c073c7afb4cd3f296b8c1a305db2f718530b7a8aca899482629aee3a5cf8bfbc
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Trust workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: c-cpp
        build-mode: manual
        queries: security-extended
    - name: Build all default unit-test paths
      run: make -j2 UNITTEST_LIST_JSON_DOM_EXTRAS=test_json_corpus test
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: /language:c-cpp
